[package]
name = "light_signal"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
stm32h7xx-hal = { version = "0.16.0", features = ["stm32h753"] }

[profile.dev]
opt-level = "s"
debug = 2
panic = "abort"
